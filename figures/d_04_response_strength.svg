  <g id="text_17">
   <text style="font-size: 8px; font-family: 'Microsoft YaHei'" transform="translate(77.76 330.046844)">响应强度 = sqrt(mean(真实变化²))；分层阈值见 strength_thresholds.csv。</text>
   <text style="font-size: 8px; font-family: 'Microsoft YaHei'" transform="translate(77.76 338.832)">handoff 模式下由 C 无变化基线的逐目标 MSE 推得，不是从缺失标签重建表达矩阵。</text>
